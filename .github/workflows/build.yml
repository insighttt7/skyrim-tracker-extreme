name: Build

# Runs on a version tag (v1.0.1 ...) and by hand from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install build tools
        run: python -m pip install -r requirements.txt

      - name: Build
        shell: cmd
        run: build.bat

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: Skyrim-Tracker-Extreme
          path: |
            dist/*.zip
            dist/SHA256.txt

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256.txt
