[package]
name = "skyrim-tracker-extreme"
version = "2.1.1"
edition = "2021"
description = "Skyrim Tracker Extreme"
license-file = "../LICENSE.txt"
publish = false

[[bin]]
name = "skyrim-tracker-extreme"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ste-core = { path = "../ste-core" }
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
serde_json = "1"

# WebView2 settings the tracker sets itself (same versions as Tauri's own)
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = "0.62"
