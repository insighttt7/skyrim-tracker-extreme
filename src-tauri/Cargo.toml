[package]
name = "skyrim-tracker-extreme"
version = "2.1.0"
edition = "2021"
description = "Skyrim Tracker Extreme"
license-file = "../LICENSE.txt"
publish = false

[[bin]]
name = "skyrim-tracker-extreme"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ste-core = { path = "../ste-core" }
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
serde_json = "1"
